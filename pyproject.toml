[project]
name = "price-lenses"
version = "0.1.0"
description = "Compare product prices, sellers, ratings and offers across sites (SerpApi + Apify) and store them in PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.31",
    "httpx>=0.27",
    "apify-client>=1.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
price-lenses = "price_lenses.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
